name: ROS Lyrical Build
run-name: "ROS Lyrical Build ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  schedule:
    - cron: '0 0 * * SUN'  # 00:00 on Sunday.


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
      packages: write
      contents: read

jobs:
  build-and-deploy-lyrical:
    uses: ./.github/workflows/build-one-ros-distro.yaml
    with:
      ros_distro: lyrical
      image_name: ros
